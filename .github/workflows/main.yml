name: CI/CD Pipeline Backend a AWS EC2 via ECR

on:
  push:
    branches:
      - Deploy

jobs:
  build-and-push:
    name: Build y Push de la Imagen a ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1 

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, y push de la imagen Docker a ECR
        working-directory: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backenddespachoinnovatech 
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-ec2:
    name: Despliegue en EC2 (Backend Privado A)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue automático vía Bastion
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_PRIVATE_IP }} 
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          proxy_host: ${{ secrets.FRONTEND_PUBLIC_IP }} 
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.AWS_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -x
            sudo mkdir -p /home/ec2-user/app
            sudo chown -R ec2-user:ec2-user /home/ec2-user/app
            cd /home/ec2-user/app

            # Crear docker-compose.yml limpio
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              db-mysql:
                image: mysql:8.0
                container_name: mysql-db
                restart: always
                environment:
                  MYSQL_ROOT_PASSWORD: admin123
                  MYSQL_DATABASE: bd-despacho
                  MYSQL_USER: user_innovatech
                  MYSQL_PASSWORD: password_innovatech
                ports:
                  - "3306:3306"
                volumes:
                  - mysql_data:/var/lib/mysql
                networks:
                  - backend_network
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin123"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              app-backend:
                image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/backenddespachoinnovatech:latest
                container_name: app-backend
                restart: always
                ports:
                  - "8080:8080"
                environment:
                  - DB_ENDPOINT=db-mysql
                  - DB_PORT=3306
                  - DB_NAME=bd-despacho
                  - DB_USER=user_innovatech
                  - DB_PASSWORD=password_innovatech
                  - SPRING_SQL_INIT_MODE=never
                  - SPRING_JPA_HIBERNATE_DDL_AUTO=update
                networks:
                  - backend_network
                depends_on:
                  db-mysql:
                    condition: service_healthy

            networks:
              backend_network:
                driver: bridge
            volumes:
              mysql_data:
            EOF

            # Ejecutar despliegue
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            sudo docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/backenddespachoinnovatech:latest
            sudo docker-compose down || true
            sudo docker-compose up -d