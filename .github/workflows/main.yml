name: CI/CD Pipeline Backend a AWS EC2 via ECR

on:
  push:
    branches:
      - Deploy
    
jobs:
  build-and-push:
    name: Build y Push de la Imagen a ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1 

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, y push de la imagen Docker a ECR
        working-directory: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backenddespachoinnovatech 
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-ec2:
    name: Despliegue en EC2 (Backend Privado)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue automático vía Bastion/Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_PRIVATE_IP }} 
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          proxy_host: ${{ secrets.FRONTEND_PUBLIC_IP }} 
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            # 1. Moverse al directorio del backend en la máquina de AWS
            cd ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
            
            # 2. Autenticar en Amazon ECR
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            
            # 3. Descargar la versión más nueva de la imagen del Backend
            sudo docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/backenddespachoinnovatech:latest
            
            # 4. Apagar y limpiar el entorno antiguo usando docker-compose
            sudo docker-compose down || true
            
            # 5. Exportar la variable de AWS Account ID para el archivo docker-compose en vivo
            export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
            
            # 6. Levantar todo el stack (MySQL + Backend + Carga de Script) en segundo plano
            sudo -E docker-compose up -d