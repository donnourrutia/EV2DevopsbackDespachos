name: CI/CD Pipeline Backend a AWS EC2 via ECR

on:
  push:
    branches:
      - Deploy

jobs:
  build-and-push:
    name: Build y Push de la Imagen a ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Eliminamos aws-session-token ya que usas claves fijas de IAM
          aws-region: us-east-1 

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, y push de la imagen Docker a ECR
        working-directory: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backenddespachoinnovatech 
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-ec2:
    name: Despliegue en EC2 (Backend Privado)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue automático vía Bastion/Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_PRIVATE_IP }} 
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          proxy_host: ${{ secrets.FRONTEND_PUBLIC_IP }} 
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            # 1. Crear el directorio de despliegue si no existe y asegurar permisos
            sudo mkdir -p /home/ec2-user/app
            sudo chown -R ec2-user:ec2-user /home/ec2-user/app
            cd /home/ec2-user/app

            # 2. Instalar Docker Compose si no está presente en la máquina virtual
            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose || true
            fi

            # 3. Escribir el script SQL desde el secreto ANTES de levantar docker-compose
            cat << 'EOF' > innovatech_ev2.sql
            ${{ secrets.SQL_SCRIPT_CONTENT }}
            EOF

            # 4. Escribir el archivo docker-compose.yml garantizando estructura limpia
            sudo rm -f docker-compose.yml
            echo "version: '3.8'" > docker-compose.yml
            echo "services:" >> docker-compose.yml
            echo "  db-mysql:" >> docker-compose.yml
            echo "    image: mysql:8.0" >> docker-compose.yml
            echo "    container_name: mysql-db" >> docker-compose.yml
            echo "    restart: always" >> docker-compose.yml
            echo "    environment:" >> docker-compose.yml
            echo "      MYSQL_ROOT_PASSWORD: rootpassword" >> docker-compose.yml
            echo "      MYSQL_DATABASE: bddespachosinnovatech" >> docker-compose.yml
            echo "      MYSQL_USER: user_innovatech" >> docker-compose.yml
            echo "      MYSQL_PASSWORD: password_innovatech" >> docker-compose.yml
            echo "    ports:" >> docker-compose.yml
            echo "      - \"3306:3306\"" >> docker-compose.yml
            echo "    volumes:" >> docker-compose.yml
            echo "      - mysql_data:/var/lib/mysql" >> docker-compose.yml
            echo "      - ./innovatech_ev2.sql:/docker-entrypoint-initdb.d/init.sql" >> docker-compose.yml
            echo "    networks:" >> docker-compose.yml
            echo "      - backend_network" >> docker-compose.yml
            echo "    healthcheck:" >> docker-compose.yml
            echo "      test: [\"CMD\", \"mysqladmin\", \"ping\", \"-h\", \"localhost\"]" >> docker-compose.yml
            echo "      timeout: 20s" >> docker-compose.yml
            echo "      retries: 10" >> docker-compose.yml
            echo "  app-backend:" >> docker-compose.yml
            echo "    image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/backenddespachoinnovatech:latest" >> docker-compose.yml
            echo "    container_name: app-backend" >> docker-compose.yml
            echo "    restart: always" >> docker-compose.yml
            echo "    ports:" >> docker-compose.yml
            echo "      - \"8080:8080\"" >> docker-compose.yml
            echo "    environment:" >> docker-compose.yml
            echo "      - DB_HOST=db-mysql" >> docker-compose.yml
            echo "      - DB_PORT=3306" >> docker-compose.yml
            echo "      - DB_NAME=bddespachosinnovatech" >> docker-compose.yml
            echo "      - DB_USER=user_innovatech" >> docker-compose.yml
            echo "      - DB_PASSWORD=password_innovatech" >> docker-compose.yml
            echo "    networks:" >> docker-compose.yml
            echo "      - backend_network" >> docker-compose.yml
            echo "    depends_on:" >> docker-compose.yml
            echo "      db-mysql:" >> docker-compose.yml
            echo "        condition: service_healthy" >> docker-compose.yml
            echo "networks:" >> docker-compose.yml
            echo "  backend_network:" >> docker-compose.yml
            echo "    driver: bridge" >> docker-compose.yml
            echo "volumes:" >> docker-compose.yml
            echo "  mysql_data:" >> docker-compose.yml

            # 5. Autenticar en Amazon ECR
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            
            # 6. Descargar la versión más nueva de tu imagen
            sudo docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/backenddespachoinnovatech:latest
            
            # 7. LIMPIEZA TOTAL: Remover contenedores antiguos que generen conflicto de nombres
            sudo docker-compose down || true
            sudo docker stop app-backend || true
            sudo docker rm -f app-backend || true
            sudo docker stop mysql-db || true
            sudo docker rm -f mysql-db || true
            
            # 8. Levantar el entorno limpio e inyectar el Account ID en segundo plano
            export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
            sudo -E docker-compose up -d