name: CI/CD Pipeline Backend a AWS EC2 via ECR

on:
  push:
    branches:
      - Deploy
    
jobs:
  build-and-push:
    name: Build y Push de la Imagen a ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1 

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, y push de la imagen Docker a ECR
        working-directory: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backenddespachoinnovatech 
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-ec2:
    name: Despliegue en EC2 (Backend Privado)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue automático vía Bastion/Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_PRIVATE_IP }} 
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          proxy_host: ${{ secrets.FRONTEND_PUBLIC_IP }} 
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            # 1. Crear el directorio de despliegue si no existe y asegurar permisos
            sudo mkdir -p /home/ec2-user/app
            sudo chown -R ec2-user:ec2-user /home/ec2-user/app
            cd /home/ec2-user/app

            # 2. Instalar Docker Compose si no está presente en la máquina virtual
            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose || true
            fi

            # 3. Descargar/Actualizar los archivos de configuración en el servidor desde la sesión de Git
            cat << 'EOF' > docker-compose.yml
            ${{ secrets.DOCKER_COMPOSE_CONTENT }}
            EOF

            cat << 'EOF' > innovatech_ev2.sql
            ${{ secrets.SQL_SCRIPT_CONTENT }}
            EOF

            # 4. Autenticar en Amazon ECR
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            
            # 5. Descargar la versión más nueva de tu imagen
            sudo docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/backenddespachoinnovatech:latest
            
            # 6. Apagar contenedores antiguos y levantar el nuevo stack
            sudo docker-compose down || true
            export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
            sudo -E docker-compose up -d