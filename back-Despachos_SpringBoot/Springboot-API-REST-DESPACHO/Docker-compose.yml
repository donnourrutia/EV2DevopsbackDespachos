version: '3.8'

services:
  # --- SERVICIO 1: BASE DE DATOS (MYSQL) ---
  db-mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: bd-despacho
      MYSQL_USER: user_innovatech
      MYSQL_PASSWORD: password_innovatech
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./innovatech_ev2.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # --- SERVICIO 2: TU BACKEND SPRING BOOT ---
  app-backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/backenddespachoinnovatech:latest
    container_name: app-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db-mysql
      - DB_PORT=3306
      - DB_NAME=bd-despacho
      - DB_USER=user_innovatech
      - DB_PASSWORD=password_innovatech
    networks:
      - backend_network
    depends_on:
      db-mysql:
        condition: service_healthy

networks:
  backend_network:
    driver: bridge

volumes:
  mysql_data: